[package]
name = "caesargit"
version = "0.2.1"
description = "CaesarGit"
edition = "2021"

[lib]
name = "caesargit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "fs", "time"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
tempfile = "3"
thiserror = "1"
