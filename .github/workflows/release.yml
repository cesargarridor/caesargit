name: Release

# Tag vX.Y.Z (lo crea scripts/release.mjs tras el merge a master) -> compila Windows y Linux aquí y publica en
# GitHub Releases de este repo (público). macOS NO se compila aquí: se compila en el Mac del dueño (scripts/mac-build.mjs)
# y sube mac-platforms.json, que el job "publish" espera para fusionarlo en latest.json y publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No se compila: lanza la release con un tag vX.Y.Z (node scripts/release.mjs)."
          fi

  # Crea el borrador de la Release.
  prepare:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          f="release-notes/$TAG.md"
          [ -f "$f" ] || { mkdir -p release-notes; echo "- Mejoras y correcciones." > "$f"; }
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" -f name="CaesarGit $TAG" -F body=@"$f" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: [gate, prepare]
    if: needs.gate.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (Tauri v2)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libssl-dev \
            build-essential pkg-config file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Notas de la versión
        id: notes
        shell: bash
        run: |
          f="release-notes/${{ github.ref_name }}.md"
          { echo "body<<NOTES_EOF"; if [ -f "$f" ]; then cat "$f"; else echo "- Mejoras y correcciones."; fi; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseName: "CaesarGit ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # La Release es borrador hasta que terminan Windows y Linux Y llegan los archivos de macOS compilados en local.
  publish:
    needs: [gate, release]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          # macOS: lo compila el dueño en su Mac (node scripts/mac-build.mjs) y sube el .dmg, el .app.tar.gz(+.sig) y
          # mac-platforms.json. Aquí se espera a ese archivo (hasta 3 h) y se fusiona en latest.json.
          ok=""
          for i in $(seq 1 360); do
            if gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -qx 'mac-platforms.json'; then ok=1; break; fi
            sleep 30
          done
          [ -n "$ok" ] || { echo "::error::No llegaron los archivos de macOS (mac-platforms.json). Compila el Mac en local: node scripts/mac-build.mjs upload $tag"; exit 1; }
          mkdir -p merge && cd merge
          gh release download "$tag" --repo "$repo" --pattern latest.json --pattern mac-platforms.json
          node -e '
            const fs=require("fs");
            const l=JSON.parse(fs.readFileSync("latest.json","utf8")), m=JSON.parse(fs.readFileSync("mac-platforms.json","utf8"));
            if(!m.platforms||!m.platforms["darwin-aarch64"]||!m.platforms["darwin-x86_64"]) throw new Error("mac-platforms.json incompleto");
            Object.assign(l.platforms, m.platforms);
            fs.writeFileSync("latest.json", JSON.stringify(l,null,2));
            console.log(Object.keys(l.platforms).join(", "));
          '
          gh release upload "$tag" latest.json --repo "$repo" --clobber
          gh release delete-asset "$tag" mac-platforms.json --repo "$repo" --yes
          cd ..
          mkdir -p assets
          gh release download "$tag" --repo "$repo" --dir assets
          (cd assets && find . -maxdepth 1 -type f ! -name 'latest.json' ! -name '*.sig' ! -name 'SHA256SUMS.txt' -printf '%P\n' | sort | xargs -r -d '\n' sha256sum > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --repo "$repo" --clobber
          gh release edit "$tag" --repo "$repo" --draft=false --latest
